name: CI

# Runs on every pull request and push to main, and is called by deploy.yml
# before anything is shipped. One required check, "Quality gate", sums it up.
#
# What gates and what only informs:
#   gates:   the PHP test suite, Pint (code style), PHPStan (larastan, level 5,
#            with phpstan-baseline.neon holding the findings that existed when
#            it was switched on: NEW findings fail, old ones are paid down by
#            deleting baseline entries), the frontend build and a check that
#            the build's manifest contains every entry the views ask for (the
#            missing-manifest 500 that broke the Dot.Projects login pages on
#            2026-10-17).
#   informs: composer and npm audit. Making them blocking would turn every run
#            red whenever a new advisory lands (Dot.Agents sat red for a month
#            that way), so they warn instead. composer audit is clean today;
#            npm audit still reports build-time advisories that need a
#            tailwindcss 3 -> 4 major upgrade (an owner decision).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Runs on main are never
# cancelled, because deploy.yml calls this workflow as its gate.
concurrency:
  group: sheet-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP tests and code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, bcmath, gd, zip, xml, fileinfo

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test --compact

  static-analysis:
    name: PHPStan (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, bcmath, gd, zip, xml, fileinfo

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  assets:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Every @vite([...]) entry in the views must exist in the manifest, or
      # the page that uses it answers 500 (ViteException). The deploy ships
      # exactly this build, so checking it here catches the failure early.
      - name: Manifest covers every Vite entry the views use
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          manifest = json.load(open('public/build/manifest.json'))
          wanted = set()
          for view in pathlib.Path('resources/views').rglob('*.php'):
              for block in re.findall(r"@vite\(\s*\[([^\]]*)\]", view.read_text()):
                  wanted.update(re.findall(r"['\"]([^'\"]+)['\"]", block))
          problems = [f'{e} is not in the manifest' for e in sorted(wanted) if e not in manifest]
          for entry, meta in manifest.items():
              if not pathlib.Path('public/build', meta['file']).is_file():
                  problems.append(f"{entry} points at {meta['file']}, which was not built")
          print('entries the views ask for:', sorted(wanted))
          print('entries in the manifest  :', sorted(manifest))
          if not wanted:
              problems.append('no @vite entries found in resources/views; the check itself is broken')
          if problems:
              print('::error::Vite manifest problem:', problems)
              sys.exit(1)
          print('OK')
          PY

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Composer audit
        continue-on-error: true
        run: composer audit --no-interaction || echo "::warning::composer audit reports advisories (not blocking)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=moderate || echo "::warning::npm audit reports advisories (not blocking; remaining ones need a tailwindcss 3 -> 4 major upgrade)"

  gate:
    name: Quality gate (all checks must pass)
    runs-on: ubuntu-latest
    needs: [tests, static-analysis, assets]
    if: always()
    steps:
      - name: Require tests, static analysis and assets to have passed
        run: |
          echo "tests:           ${{ needs.tests.result }}"
          echo "static-analysis: ${{ needs.static-analysis.result }}"
          echo "assets:          ${{ needs.assets.result }}"
          [ "${{ needs.tests.result }}" = "success" ] || exit 1
          [ "${{ needs.static-analysis.result }}" = "success" ] || exit 1
          [ "${{ needs.assets.result }}" = "success" ] || exit 1
