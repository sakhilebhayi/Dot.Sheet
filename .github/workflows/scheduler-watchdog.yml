name: Scheduler Watchdog

# The alarm that reaches a person. Every 15 minutes, from GitHub (so it
# keeps working when the shared host's crontab does not), ask the public
# /up/scheduler probe whether the scheduler and the queue worker ran recently
# and FAIL this run if not; GitHub emails the owner on a failed scheduled
# run. Read-only; the host name is public and no secret is needed.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Scheduler and queue alive
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the scheduler probe
        env:
          HOST: sheets.infodot.co.za
        run: |
          set -uo pipefail
          body="$(mktemp)"
          # The probe answers 200 (fresh) or 503 (the app says stale): both are
          # real answers. Anything else -- the shared host's edge firewall
          # refusing a GitHub runner IP (403, ~2-7% of requests), a timeout
          # (000), a gateway error -- may be transient, so retry before
          # raising an alarm that emails the owner.
          for attempt in 1 2 3; do
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 -H "Accept: application/json" "https://$HOST/up/scheduler" || echo 000)
            echo "attempt $attempt: GET /up/scheduler -> $code"
            case "$code" in 200|503) break ;; esac
            [ "$attempt" -lt 3 ] && sleep 30
          done
          cat "$body"; echo
          case "$code" in
            200) exit 0 ;;
            503) echo "::error::The app answered 503: the scheduler or the queue worker has not run recently on $HOST."; exit 1 ;;
            *)   echo "::error::Probe unreachable or refused on all 3 attempts (last HTTP $code). 403 = the host's edge firewall blocking GitHub runners; 000/5xx = the site may be down."; exit 1 ;;
          esac
